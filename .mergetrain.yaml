version: 1

# mergetrain deploys mergetrain. The gates below are the checks CI runs that a
# single machine can reproduce; the post-push verify hook covers the ones it
# cannot (the Windows and Python 3.10-3.14 legs). See docs/development.md.

project:
  name: mergetrain

state:
  db: .mergetrain/queue.sqlite
  logs: .mergetrain/logs
  worktree_root: .mergetrain/worktrees

git:
  remote: origin
  integration_branch: main
  push_refs:
    - main

queue:
  lock_ttl_minutes: 30
  daemon_interval_seconds: 15
  heartbeat_interval_seconds: 10
  command_timeout_seconds: 3600

agent:
  require_clean_worktree_before_enqueue: true
  require_explicit_auto_approval: true
  prefer_json_status: true

terminology:
  # Human-facing label only. Machine status remains `deployed`.
  git_operation: deploy

gate_parallelism:
  # ruff and mypy are independent; the pytest-xdist gate consumes the full
  # local gate budget and therefore never overlaps another check.
  max_workers: 4
  timeout_seconds: 3600

gates:
  - name: diff-check
    run: git diff --check ${integration_ref}..HEAD
  # ruff and mypy are the blocking CI lint job. They ran only in CI before, so
  # a lint error could land on main and stay there; both are dev extras
  # (`pip install -e ".[dev]"`), and a missing tool fails the gate on purpose.
  - name: ruff
    run: ruff check .
    parallel_group: quality
    workers: 1
  - name: mypy
    run: mypy
    parallel_group: quality
    workers: 1
  # Match CI's parallel coverage invocation and critical-module ratchet. The
  # command runs through /bin/sh, so the second check executes only after
  # pytest and the overall coverage floor pass.
  - name: tests
    run: python3.12 -m pytest -q -n auto --cov=mergetrain --cov-report=term-missing --cov-report=json:.coverage.json && python3.12 scripts/check_critical_coverage.py .coverage.json
    needs:
      - ruff
      - mypy
    workers: 4

deploy:
  verify:
    - name: github-ci
      run: scripts/verify-ci.sh
  reuse:
    enabled: false
    max_age_minutes: 60
    on_mismatch: rerun
    fingerprints: []
