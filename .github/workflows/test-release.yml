name: TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Require protected main workflow ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "test-release.yml must be dispatched with --ref main" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate requested release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/verify_release_source.py verify \
            --tag "${RELEASE_TAG}" \
            --allowed-signers .github/release-allowed-signers \
            --github-output "${GITHUB_OUTPUT}"

  build:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: python scripts/check_release.py --tag "${RELEASE_TAG}"
      - name: Test and build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-python-package-distributions
          path: dist/

  publish:
    needs: [verify, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
