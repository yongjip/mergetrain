name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Windows is now verified and blocking (issue #33). One Python version
        # keeps the matrix fast; the pure-Python code path is the same across
        # versions, and the OS-specific behavior is what Windows guards.
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -n auto --cov=mergetrain --cov-report=term-missing --cov-report=json:.coverage.json && python scripts/check_critical_coverage.py .coverage.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Architecture guardrails
        run: python scripts/check_architecture.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  dashboard:
    # The wheel ships the built dashboard from src/mergetrain/dashboard_dist, so
    # that directory is a build artifact kept in the repository. Nothing used to
    # verify it: dashboard/test never ran here, and a dist rebuilt from stale
    # source (or not rebuilt at all) would ship silently. `npm ci` plus the
    # pinned Node in dashboard/.nvmrc make the build reproducible, so a drifted
    # dist shows up as a dirty tree.
    runs-on: ubuntu-latest
    # Post-push verification waits 15 minutes for this workflow. Bound a stuck
    # browser/tool process early enough that the run reaches a truthful terminal
    # result inside that evidence window instead of lingering for GitHub's
    # multi-hour default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Install browser test runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Build
        run: npm run build
      - name: Assert the packaged dashboard matches its source
        working-directory: .
        run: |
          drift="$(git status --porcelain -- src/mergetrain/dashboard_dist)"
          if [ -n "$drift" ]; then
            echo "::error::src/mergetrain/dashboard_dist does not match dashboard/src."
            echo "Run 'npm run build' in dashboard/ and commit the result."
            printf '%s\n' "$drift"
            git diff --stat -- src/mergetrain/dashboard_dist
            exit 1
          fi
          echo "packaged dashboard is current"

  mcp:
    # `mergetrain mcp` is the only code path that needs the MCP SDK, and the SDK
    # pulls ~30 packages, so it stays out of the dev extra and off the test
    # matrix. This leg installs it so the deploy gate's confirmation paths --
    # the ones that need a real pydantic schema -- actually run somewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install with the mcp extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,dev]"
      - name: MCP server tests
        run: python -m pytest tests/test_mcp_server.py -q
      - name: Assert nothing is skipped for a missing extra
        run: |
          python -m pytest tests/test_mcp_server.py -q -rs 2>&1 | tee result.txt
          if grep -q "the mcp extra is not installed" result.txt; then
            echo "::error::the mcp extra did not install; these tests only ran as skips"
            exit 1
          fi
      - name: Launch the built wheel as a clean stdio MCP server
        run: |
          python -m build --wheel
          python -m venv /tmp/mergetrain-mcp-wheel
          wheel="$(find dist -name 'mergetrain-*.whl' -print -quit)"
          /tmp/mergetrain-mcp-wheel/bin/python -m pip install "${wheel}[mcp]"
          python scripts/check_mcp_registry_launch.py --timeout 60 \
            --command /tmp/mergetrain-mcp-wheel/bin/mergetrain mcp

  claude-plugin:
    # Keep the distributable plugin valid against a pinned Claude Code CLI and
    # keep its operating protocol synchronized with the CLI-generated agent
    # contract. The MCP executable itself is exercised by the mcp job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install core runtime
        run: python -m pip install -e .
      - name: Assert agent protocol surfaces match
        run: python scripts/check_agent_protocol.py
      - name: Assert discovery metadata surfaces match
        run: python scripts/check_discovery_metadata.py
      - name: Validate the Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate integrations/claude/plugin --strict
      - name: Validate the self-marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate . --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release metadata
        run: python scripts/check_release.py
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/mergetrain-smoke
          /tmp/mergetrain-smoke/bin/python -m pip install dist/*.whl
          /tmp/mergetrain-smoke/bin/python -c "import yaml"
          /tmp/mergetrain-smoke/bin/mergetrain --version
          /tmp/mergetrain-smoke/bin/mergetrain dashboard --help
      - name: Extract and run the sdist's packaged test suite
        env:
          MERGETRAIN_SDIST_PYTHON: python
        run: bash scripts/check_sdist.sh dist/*.tar.gz

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Drives the installed `mergetrain` CLI through every workflow against real
      # git repos. PYTHON=python pins the interpreter actions/setup-python put on
      # PATH (the script defaults to python3 otherwise).
      - name: End-to-end
        env:
          PYTHON: python
        run: bash scripts/e2e.sh
