name: Publish MCP Registry

# This workflow is manually dispatchable for the initial publication and is
# reused by release.yml after PyPI publishing succeeds. GitHub OIDC proves the
# repository identity without storing or forwarding a long-lived token.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "v1.8.0"
      MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release metadata
        run: python scripts/check_release.py
      - name: Install the pinned MCP publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_SHA256}" "${archive}" \
            | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          ./mcp-publisher --version
      - name: Validate the Registry manifest
        run: ./mcp-publisher validate server.json
      - name: Install the pinned Registry runtime
        run: python -m pip install uv==0.12.7
      - name: Launch the exact published stdio MCP server
        run: python scripts/check_mcp_registry_launch.py --attempts 18 --timeout 120
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish the Registry manifest
        run: ./mcp-publisher publish server.json
