name: Release

# Builds in an unprivileged job, then publishes the checked artifacts to PyPI
# via Trusted Publishing (OIDC) when a GitHub Release is published. No API token
# is stored. See docs/release.md for the one-time publisher and environment setup.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release tag and metadata
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - name: Test and build distributions
        run: |
          python -m pip install --upgrade build twine
          PYTHONPATH=src python -m unittest discover -s tests
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1

  publish-mcp-registry:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml

  bump-tap:
    # The Homebrew tap bumps itself from PyPI on a daily cron, which GitHub
    # disables after 60 days without repository activity — exactly what a quiet
    # tap looks like. Poking its workflow_dispatch here makes a release's bump
    # immediate and keeps the schedule alive. Optional by design: without the
    # HOMEBREW_TAP_DISPATCH_TOKEN secret this step is skipped, and the cron
    # remains the only path. See docs/release.md.
    needs: publish
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch the tap bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not set; leaving the bump to the tap's cron"
            exit 0
          fi
          # PyPI's CDN can still be serving the previous "latest" right after a
          # publish, and the tap reads that endpoint, so give it a moment.
          sleep 60
          gh workflow run bump.yml --repo "${TAP_REPOSITORY}"
          echo "requested a formula bump in ${TAP_REPOSITORY}"
