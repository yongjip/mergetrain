name: Release

# Production publication is dispatched only at protected main after a human
# publishes an immutable GitHub Release. Main's workflow and signer policy
# authenticate the requested tag before any tag-provided code runs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Require protected main workflow ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "release.yml must be dispatched with --ref main" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate requested release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/verify_release_source.py verify \
            --tag "${RELEASE_TAG}" \
            --allowed-signers .github/release-allowed-signers \
            --github-output "${GITHUB_OUTPUT}"
      - name: Require the human-published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          TAG_OBJECT_SHA: ${{ steps.source.outputs.tag_object_sha }}
          RELEASE_COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
        run: |
          python scripts/verify_release_source.py recheck \
            --tag "${RELEASE_TAG}" \
            --expected-tag-object "${TAG_OBJECT_SHA}" \
            --expected-commit "${RELEASE_COMMIT_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'select(.draft == false and .immutable == true) | .tag_name' \
            | grep -Fx "${RELEASE_TAG}"

  build:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag and metadata
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: python scripts/check_release.py --tag "${RELEASE_TAG}"
      - name: Test and build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e .
          PYTHONPATH=src python -m unittest discover -s tests
          python -m build
          python -m twine check --strict dist/*
          MERGETRAIN_SDIST_PYTHON=python bash scripts/check_sdist.sh dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  attest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054d4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*

  publish:
    needs: [verify, attest]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054d4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  publish-mcp-registry:
    needs: [verify, publish]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      source_sha: ${{ needs.verify.outputs.commit_sha }}

  bump-tap:
    # Optional and isolated from source checkout. Without the tap-scoped secret,
    # the tap's daily cron remains the fallback. See docs/release.md.
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.HOMEBREW_TAP_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch the tap bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not set; leaving the bump to the tap's cron"
            exit 0
          fi
          sleep 60
          gh workflow run bump.yml --repo "${TAP_REPOSITORY}"
          echo "requested a formula bump in ${TAP_REPOSITORY}"
